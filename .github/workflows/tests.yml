name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    # Nova is a paid, private Composer package. These repository secrets must be
    # set for CI to install it:
    #   NOVA_USERNAME       – the email address on your Nova account
    #   NOVA_LICENSE_KEY    – your Nova license key
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        testbench: ['^8.24', '^9.0']
        exclude:
          - php: '8.1'
            testbench: '^9.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Configure Nova Composer repository
        run: |
          composer config repositories.nova composer https://nova.laravel.com
          composer config --auth http-basic.nova.laravel.com \
            "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_LICENSE_KEY }}"

      - name: Select Testbench version
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
