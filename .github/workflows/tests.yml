# PHPUnit + PHPStan both need `laravel/nova`, a paid private Composer package,
# so this workflow does NOT run automatically. Run it on demand from the Actions
# tab once these repository secrets are set:
#   NOVA_USERNAME     – the email address on your Nova account
#   NOVA_LICENSE_KEY  – your Nova license key
#
# Without a Nova license, run the suite locally instead: `composer test`,
# `composer analyse` (see CONTRIBUTING.md).
name: tests

on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', nova: '^4.0', testbench: '^8.30', dependencies: lowest }
          - { php: '8.2', nova: '^4.0', testbench: '^9.8', dependencies: highest }
          - { php: '8.2', nova: '^5.0', testbench: '^9.8', dependencies: highest }
          - { php: '8.3', nova: '^5.0', testbench: '^9.8', dependencies: highest }

    name: PHP ${{ matrix.php }} / Nova ${{ matrix.nova }} / ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Configure Nova Composer repository
        run: |
          composer config repositories.nova composer https://nova.laravel.com
          composer config --auth http-basic.nova.laravel.com \
            "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_LICENSE_KEY }}"

      - name: Pin Nova and Testbench versions
        run: |
          composer require "laravel/nova:${{ matrix.nova }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Configure Nova Composer repository
        run: |
          composer config repositories.nova composer https://nova.laravel.com
          composer config --auth http-basic.nova.laravel.com \
            "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_LICENSE_KEY }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
