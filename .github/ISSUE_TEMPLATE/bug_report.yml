name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the field definition you used, e.g. `ReadMore::make('Notes')->characters(40)`.
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: nova-version
    attributes:
      label: Nova version
      placeholder: "4.35.11"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
