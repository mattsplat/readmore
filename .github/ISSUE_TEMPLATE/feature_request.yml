name: Feature request
description: Suggest an improvement or new option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: If it adds a method, show how it would be called.
    validations:
      required: false
